<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none">
  <!-- Geometric Octagonal Node Icon -->
  <g transform="translate(2, 2)">
    <!-- Outer Octagonal Ring -->
    <polygon points="12,2 28,2 38,12 38,28 28,38 12,38 2,28 2,12" stroke="#0066FF" stroke-width="2.5" fill="#0B1F3A" fill-opacity="0.8"/>
    <!-- Inner Geometric Data Core -->
    <polygon points="15,9 25,9 31,15 31,25 25,31 15,31 9,25 9,15" stroke="#38BDF8" stroke-width="1.5" fill="#0066FF" fill-opacity="0.25"/>
    <!-- Center Binary Pulse Dot -->
    <rect x="18" y="18" width="4" height="4" fill="#00E5FF"/>
    <!-- Corner Tech Ticks -->
    <line x1="2" y1="12" x2="6" y2="12" stroke="#00E5FF" stroke-width="1.5"/>
    <line x1="38" y1="28" x2="34" y2="28" stroke="#00E5FF" stroke-width="1.5"/>
  </g>
  <!-- Wordmark for Dark Backgrounds -->
  <text x="52" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="21" letter-spacing="-0.03em" fill="#FFFFFF">
    ZERO<tspan fill="#0066FF">BYTE</tspan><tspan fill="#38BDF8" font-weight="400">CH</tspan>
  </text>
  <!-- Engineering Sub-descriptor -->
  <text x="53" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.22em" fill="#94A3B8">
    CLOUD ENGINEERING
  </text>
</svg>
