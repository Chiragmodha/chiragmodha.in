services:
  zerobytech-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zerobytech:latest
    container_name: zerobytech_website
    restart: unless-stopped
    ports:
      - "80:80"       # Standard HTTP port (change to "8080:80" if port 80 is in use)
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
